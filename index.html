<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雨穴素材集</title>
<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 16px;
  font-family: sans-serif;
  background: #f5f5f5;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
}

.button {
  aspect-ratio: 1 / 1;
  width: 100%;
  border: none;
  border-radius: 10px;
  background: white;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
  font-size: 14px;
  padding: 8px;
  word-break: break-all;
  overflow-wrap: anywhere;
  cursor: pointer;
}

.button:active:not(:disabled) {
  transform: scale(0.97);
}

.button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

@media (min-width: 700px) {
  .grid {
    max-width: 700px;
  }

  .button {
    font-size: 16px;
  }
}
</style>
</head>
<body>

<div class="grid" id="grid"></div>

<script>
const files = [
  "ありがとうございました.mp3/mp3",
  "あれぇ.mp3/mp3",
  "うーん、どこがへんなのかなぁ？.mp3/mp3",
  "え、お前天才か？.mp3/mp3",
  "ここ、なんなんだろう.mp3/mp3",
  "ここは一度私の知り合いの建築技師さんの栗原さんに電話をしてみようと思います.mp3/mp3",
  "これは一発でやばいとわかります.mp3/mp3",
  "じゃあこれはダメでぇ.mp3/mp3",
  "たしかに冷静に考えたらですけど.mp3/mp3",
  "キッチン細いね.mp3/mp3",
  "テレビ置きづらいね.mp3/mp3",
  "大丈夫ぅ.mp3/mp3",
  "栗原ぁぁ！.mp3/mp3",
  "窓無ぁぁい.mp3/mp3",
  "窓無いですよ.mp3/mp3"
];

const grid = document.getElementById("grid");
let audio = null;

files.forEach((file, index) => {
  const button = document.createElement("button");

  button.className = "button";
  button.textContent = file;

  button.addEventListener("click", () => {
    if (audio !== null) return;

    audio = new Audio("mp3/" + file);

    const buttons = document.querySelectorAll(".button");
    buttons.forEach(b => {
      b.disabled = true;
    });

    audio.play().catch(() => {
      buttons.forEach(b => {
        b.disabled = false;
      });
      audio = null;
      alert("音声を再生できませんでした。");
    });

    audio.addEventListener("ended", () => {
      buttons.forEach(b => {
        b.disabled = false;
      });
      audio = null;
    });

    audio.addEventListener("error", () => {
      buttons.forEach(b => {
        b.disabled = false;
      });
      audio = null;
      alert("音声を読み込めませんでした: " + file);
    });
  });

  grid.appendChild(button);
});
</script>

</body>
</html>
